[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "zerobom"
version = "0.1.0"
description = "Deterministic pre-CVE security advisory verification and OSV compilation engine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "zerobom Contributors" },
]
keywords = [
    "sbom",
    "security",
    "pre-cve",
    "osv",
    "cyclonedx",
    "spdx",
    "sarif",
    "appsec",
    "vulnerability",
    "supply-chain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9,<3",
    "packageurl-python>=0.16",
    "univers>=30.11.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.9",
]

[project.urls]
Homepage = "https://zerobom.dev/"
Documentation = "https://zerobom.dev/"
Repository = "https://github.com/zerobom-dev/zerobom"
Issues = "https://github.com/zerobom-dev/zerobom/issues"
Changelog = "https://github.com/zerobom-dev/zerobom/blob/main/CHANGELOG.md"

[project.scripts]
zerobom = "zerobom.cli:app"

[project.optional-dependencies]
aws = [
    "zerobom-aws>=0.1.0,<0.2.0",
]
gcp = [
    "zerobom-gcp>=0.1.0,<0.2.0",
]
azure = [
    "zerobom-azure>=0.1.0,<0.2.0",
]
slack = [
    "slack-sdk>=3.33",
]

[project.entry-points."zerobom.backends"]
local_sbom = "zerobom.backends.local_sbom:LocalSbomBackend"
dependency_track = "zerobom.backends.dependency_track:DependencyTrackBackend"
oci_sbom = "zerobom.backends.oci_sbom:OciSbomBackend"
k8s_sbom = "zerobom.backends.k8s_sbom:K8sSbomBackend"

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
zerobom = { workspace = true }
zerobom-aws = { workspace = true }
zerobom-gcp = { workspace = true }
zerobom-azure = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]
docs = [
    "zensical>=0.1.2,<0.2.0",
    "mkdocstrings-python>=1.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zerobom"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/zerobom",
    "/tests",
    "/sources.yaml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "emulator: real-wire cloud storage emulator integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [
    "src",
    "plugins/zerobom-aws/src",
    "plugins/zerobom-gcp/src",
    "plugins/zerobom-azure/src",
    "tests",
]
extend-exclude = [".venv-*", ".cache", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["zerobom"]

[[tool.mypy.overrides]]
module = [
    "packageurl",
    "packageurl.*",
    "univers",
    "univers.*",
    "trafilatura",
    "trafilatura.*",
    "feedparser",
    "feedparser.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "google",
    "google.*",
    "azure",
    "azure.*",
    "slack_sdk",
    "slack_sdk.*",
]
ignore_missing_imports = true
