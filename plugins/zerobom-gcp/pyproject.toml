[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "zerobom-gcp"
version = "0.1.0"
description = "GCP Artifact Analysis and GCS SBOM inventory backend plugins for zerobom."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "zerobom Contributors" },
]
keywords = ["zerobom", "gcp", "artifact-analysis", "gcs", "sbom", "pre-cve"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "zerobom>=0.1.0,<0.2.0",
    "httpx>=0.27",
    "google-auth[requests]>=2.35",
]

[project.urls]
Homepage = "https://zerobom.dev/"
Documentation = "https://zerobom.dev/backends/"
Repository = "https://github.com/zerobom-dev/zerobom"
Issues = "https://github.com/zerobom-dev/zerobom/issues"

[project.optional-dependencies]
adc = []

[project.entry-points."zerobom.backends"]
gcp_artifact_analysis = "zerobom_gcp.artifact_analysis:GcpArtifactAnalysisBackend"
gcs_sbom = "zerobom_gcp.gcs_sbom:GcsSbomBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/zerobom_gcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/zerobom_gcp",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
