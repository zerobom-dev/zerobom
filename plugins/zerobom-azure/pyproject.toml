[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "zerobom-azure"
version = "0.1.0"
description = "Azure Resource Graph and Blob Storage SBOM inventory backend plugins for zerobom."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "zerobom Contributors" },
]
keywords = ["zerobom", "azure", "resource-graph", "blob-storage", "sbom", "pre-cve"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "zerobom>=0.1.0,<0.2.0",
    "httpx>=0.27",
    "azure-identity>=1.19",
]

[project.urls]
Homepage = "https://zerobom.dev/"
Documentation = "https://docs.zerobom.dev/backends/"
Repository = "https://github.com/zerobom-dev/zerobom"
Issues = "https://github.com/zerobom-dev/zerobom/issues"

[project.optional-dependencies]
identity = []

[project.entry-points."zerobom.backends"]
azure_resource_graph = "zerobom_azure.resource_graph:AzureResourceGraphBackend"
azure_blob_sbom = "zerobom_azure.blob_sbom:AzureBlobSbomBackend"

[tool.hatch.build.targets.wheel]
packages = ["src/zerobom_azure"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/zerobom_azure",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
