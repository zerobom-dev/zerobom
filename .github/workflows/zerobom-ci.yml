name: zerobom CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies and workspace plugins
        run: uv sync --all-extras

      - name: Run Ruff lint (style, docstrings, security)
        run: uv run ruff check .

      - name: Run Ruff formatting check
        run: uv run ruff format --check .

      - name: Run Mypy strict type checks (core, benchmarks, cloud plugins)
        run: |
          uv run mypy src/
          uv run mypy --strict benchmarks/
          uv run mypy --strict plugins/zerobom-aws/src plugins/zerobom-gcp/src plugins/zerobom-azure/src

      - name: Run offline unit and integration tests
        run: uv run pytest -v

      - name: Run deterministic offline evaluation benchmark
        run: uv run python benchmarks/run_evals.py --mode offline

      - name: Smoke-test offline demo multi-sink outputs and backend discovery
        run: |
          uv run zerobom demo --json-out .cache/demo-ci.json --sarif-out .cache/demo-ci.sarif
          uv run zerobom backends
